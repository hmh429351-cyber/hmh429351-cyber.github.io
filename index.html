    // 渲染与逻辑
    let currentFilterProvince = "all";
    let currentFilterLevel = "all";

    const scenicListEl = document.getElementById("scenicList");
    const provinceSelect = document.getElementById("provinceFilter");
    const levelSelect = document.getElementById("levelFilter");
    const resetBtn = document.getElementById("resetBtn");
    const totalSpan = document.getElementById("totalCount");
    const fiveASpan = document.getElementById("fiveACount");
    const fourAPlusSpan = document.getElementById("fourACount");

    // 获取省份选项（去重）
    const provinces = [...new Set(rawData.map(item => item.province))].sort();
    provinces.forEach(prov => {
        const option = document.createElement("option");
        option.value = prov;
        option.textContent = prov;
        provinceSelect.appendChild(option);
    });

    function getLevelClass(level) {
        if (level === "AAAAA") return "level-AAAAA";
        if (level === "AAAA") return "level-AAAA";
        if (level === "AAA") return "level-AAA";
        return "no-level";
    }

    function getLevelDisplay(level) {
        if (level === "/") return "未评级";
        if (level === "AA") return "AA级景区";
        return level + "级";
    }

    function matchesFilter(item) {
        // 省份筛选
        if (currentFilterProvince !== "all" && item.province !== currentFilterProvince) return false;
        // 等级筛选
        const lev = item.level;
        if (currentFilterLevel === "all") return true;
        if (currentFilterLevel === "AAAAA") return lev === "AAAAA";
        if (currentFilterLevel === "AAAA") return lev === "AAAA";
        if (currentFilterLevel === "AAA") return lev === "AAA";
        if (currentFilterLevel === "AA") return lev === "AA";
        if (currentFilterLevel === "no_level") return lev === "/" || (lev !== "AAAAA" && lev !== "AAAA" && lev !== "AAA" && lev !== "AA");
        return true;
    }

    function updateStats(filteredData) {
        totalSpan.innerText = filteredData.length;
        const fiveA = filteredData.filter(d => d.level === "AAAAA").length;
        const fourAUp = filteredData.filter(d => d.level === "AAAAA" || d.level === "AAAA").length;
        fiveASpan.innerText = fiveA;
        fourAPlusSpan.innerText = fourAUp;
    }

    function render() {
        const filtered = rawData.filter(matchesFilter);
        if (filtered.length === 0) {
            scenicListEl.innerHTML = `<div class="empty-state">🌿 没有找到匹配的景区，试试调整筛选条件吧</div>`;
            updateStats(filtered);
            return;
        }
        const html = filtered.map(item => {
            const levelClass = getLevelClass(item.level);
            const levelShow = getLevelDisplay(item.level);
            return `
                <div class="card">
                    <div class="info">
                        <div class="scenic-name">${escapeHtml(item.name)}</div>
                        <div class="meta">
                            <span>📍 ${item.province} · ${item.city}</span>
                        </div>
                        <div class="badge-level ${levelClass}">⭐ ${levelShow}</div>
                    </div>
                </div>
            `;
        }).join('');
        scenicListEl.innerHTML = html;
        updateStats(filtered);
    }

    // 简单防XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function applyFilters() {
        currentFilterProvince = provinceSelect.value;
        currentFilterLevel = levelSelect.value;
        render();
    }

    provinceSelect.addEventListener("change", applyFilters);
    levelSelect.addEventListener("change", applyFilters);
    resetBtn.addEventListener("click", () => {
        provinceSelect.value = "all";
        levelSelect.value = "all";
        applyFilters();
    });

    // 初始渲染
    render();
